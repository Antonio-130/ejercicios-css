<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 590" width="688" height="590" role="img" aria-label="Referencia visual: catálogo con producto destacado, etiqueta de oferta y precio tachado">
  <rect width="688" height="590" fill="#f4f1ec" />
  <text x="344" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8a7a6a">Referencia — la página debería verse así (wireframe, no es pixel-perfect)</text>

  <!-- Encabezado -->
  <text x="24" y="58" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#b25b1f">Ferretería El Tornillo</text>
  <text x="24" y="86" font-family="system-ui, sans-serif" font-size="15" fill="#5a5a5a">Productos</text>
  <text x="112" y="86" font-family="system-ui, sans-serif" font-size="15" fill="#5a5a5a">Ofertas</text>
  <text x="184" y="86" font-family="system-ui, sans-serif" font-size="15" fill="#5a5a5a">Contacto</text>

  <!-- Item 1 -->
  <rect x="24" y="106" width="640" height="84" rx="8" fill="#ffffff" stroke="#e0d8cc" />
  <text x="48" y="140" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2b2b2b">Taladro 500W</text>
  <text x="48" y="170" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2a9d8f">$45.000</text>

  <!-- Item 2 destacado -->
  <rect x="24" y="202" width="640" height="84" rx="8" fill="#ffffff" stroke="#e0d8cc" />
  <rect x="24" y="202" width="6" height="84" fill="#b25b1f" />
  <text x="48" y="236" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2b2b2b">Set de mechas</text>
  <text x="48" y="266" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2a9d8f">$8.500</text>

  <!-- Item 3 oferta -->
  <rect x="24" y="298" width="640" height="112" rx="8" fill="#ffffff" stroke="#e0d8cc" />
  <rect x="48" y="314" width="76" height="22" rx="4" fill="#e63946" />
  <text x="86" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ffffff">OFERTA</text>
  <text x="48" y="366" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2b2b2b">Amoladora angular</text>
  <text x="48" y="394" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#e63946" text-decoration="line-through">$32.000</text>

  <!-- Item 4 -->
  <rect x="24" y="422" width="640" height="84" rx="8" fill="#ffffff" stroke="#e0d8cc" />
  <text x="48" y="456" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#2b2b2b">Caja de herramientas</text>
  <text x="48" y="486" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#2a9d8f">$21.000</text>

  <!-- Aviso -->
  <rect x="24" y="522" width="640" height="48" rx="8" fill="#fff3cd" stroke="#ffe08a" />
  <text x="48" y="552" font-family="system-ui, sans-serif" font-size="15" fill="#7a5b00">Envío gratis en compras mayores a $20.000.</text>
</svg>
