<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferretería El Tornillo — Productos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="cabecera">
      <h1 class="titulo">Ferretería El Tornillo</h1>
      <nav class="nav">
        <a class="nav-link" href="#">Productos</a>
        <a class="nav-link" href="#">Ofertas</a>
        <a class="nav-link" href="#">Contacto</a>
      </nav>
    </header>

    <main class="lista">
      <article class="item">
        <h2 class="nombre">Taladro 500W</h2>
        <p class="precio">$45.000</p>
      </article>

      <article class="item destacado">
        <h2 class="nombre">Set de mechas</h2>
        <p class="precio">$8.500</p>
      </article>

      <article class="item oferta">
        <span class="etiqueta">OFERTA</span>
        <h2 class="nombre">Amoladora angular</h2>
        <p class="precio">$32.000</p>
      </article>

      <article class="item">
        <h2 class="nombre">Caja de herramientas</h2>
        <p class="precio">$21.000</p>
      </article>
    </main>

    <p class="aviso">Envío gratis en compras mayores a $20.000.</p>
  </body>
</html>
