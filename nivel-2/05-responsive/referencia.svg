<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Referencia visual: barra, franja hero y cuatro tarjetas de gustos en fila">
  <rect width="900" height="440" fill="#fdf6f0" />

  <!-- Barra -->
  <rect x="0" y="0" width="900" height="56" fill="#d62828" />
  <text x="24" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Heladería Copos</text>
  <text x="660" y="36" font-family="system-ui, sans-serif" font-size="14" fill="#ffd166">Sabores</text>
  <text x="740" y="36" font-family="system-ui, sans-serif" font-size="14" fill="#ffd166">Sucursales</text>
  <text x="834" y="36" font-family="system-ui, sans-serif" font-size="14" fill="#ffd166">Pedidos</text>

  <!-- Hero -->
  <rect x="0" y="56" width="900" height="124" fill="#e8590c" />
  <text x="450" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">El verano tiene sabor</text>
  <text x="450" y="142" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#ffe8d6">Más de 30 gustos artesanales, todos los días.</text>

  <!-- Título -->
  <text x="450" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#3d2b1f">Los más pedidos</text>

  <!-- Tarjetas -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="26" y="240" width="200" height="160" rx="10" fill="#ffffff" stroke="#f0dccb" />
    <rect x="42" y="256" width="168" height="70" rx="8" fill="#f59e0b" />
    <text x="126" y="358" font-size="16" font-weight="bold" fill="#3d2b1f">Dulce de leche</text>
    <text x="126" y="380" font-size="14" fill="#8a6f5c">$2.500</text>

    <rect x="242" y="240" width="200" height="160" rx="10" fill="#ffffff" stroke="#f0dccb" />
    <rect x="258" y="256" width="168" height="70" rx="8" fill="#8b5e34" />
    <text x="342" y="358" font-size="16" font-weight="bold" fill="#3d2b1f">Chocolate</text>
    <text x="342" y="380" font-size="14" fill="#8a6f5c">$2.700</text>

    <rect x="458" y="240" width="200" height="160" rx="10" fill="#ffffff" stroke="#f0dccb" />
    <rect x="474" y="256" width="168" height="70" rx="8" fill="#db2777" />
    <text x="558" y="358" font-size="16" font-weight="bold" fill="#3d2b1f">Frutilla</text>
    <text x="558" y="380" font-size="14" fill="#8a6f5c">$2.400</text>

    <rect x="674" y="240" width="200" height="160" rx="10" fill="#ffffff" stroke="#f0dccb" />
    <rect x="690" y="256" width="168" height="70" rx="8" fill="#fde047" />
    <text x="774" y="358" font-size="16" font-weight="bold" fill="#3d2b1f">Limón</text>
    <text x="774" y="380" font-size="14" fill="#8a6f5c">$2.300</text>
  </g>
</svg>
