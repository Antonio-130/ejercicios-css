<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heladería Copos — Gustos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="barra">
      <span class="logo">Heladería Copos</span>
      <nav class="links">
        <a href="#">Sabores</a>
        <a href="#">Sucursales</a>
        <a href="#">Pedidos</a>
      </nav>
    </header>

    <section class="hero">
      <h1>El verano tiene sabor</h1>
      <p>Más de 30 gustos artesanales, todos los días.</p>
    </section>

    <main class="contenedor">
      <h2 class="titulo">Los más pedidos</h2>

      <section class="gustos">
        <article class="gusto">
          <div class="muestra"></div>
          <h3>Dulce de leche</h3>
          <p>$2.500</p>
        </article>

        <article class="gusto">
          <div class="muestra"></div>
          <h3>Chocolate</h3>
          <p>$2.700</p>
        </article>

        <article class="gusto">
          <div class="muestra"></div>
          <h3>Frutilla</h3>
          <p>$2.400</p>
        </article>

        <article class="gusto">
          <div class="muestra"></div>
          <h3>Limón</h3>
          <p>$2.300</p>
        </article>
      </section>
    </main>
  </body>
</html>
