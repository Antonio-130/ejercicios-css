<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estudio Yoga Sereno</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="encabezado">
      <h1 class="titulo">Estudio Yoga Sereno</h1>
      <p class="bajada">Clases para todos los niveles</p>
    </header>

    <main class="contenedor">
      <section class="galeria">
        <figure class="video">
          <div class="pantalla"></div>
          <figcaption>Clase de respiración</figcaption>
        </figure>

        <figure class="video">
          <div class="pantalla"></div>
          <figcaption>Posturas básicas</figcaption>
        </figure>

        <figure class="video">
          <div class="pantalla"></div>
          <figcaption>Meditación guiada</figcaption>
        </figure>
      </section>

      <section class="planes">
        <article class="plan">
          <h2>Clase suelta</h2>
          <p class="precio">$3.000</p>
        </article>

        <article class="plan">
          <span class="etiqueta">PROMO</span>
          <h2>Plan mensual</h2>
          <p class="precio">$18.000</p>
        </article>

        <article class="plan">
          <h2>Plan trimestral</h2>
          <p class="precio">$48.000</p>
        </article>
      </section>
    </main>
  </body>
</html>
