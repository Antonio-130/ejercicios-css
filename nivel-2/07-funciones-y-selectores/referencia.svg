<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="Referencia visual: título adaptable, tres recuadros de video 16:9 y tres planes, el del medio con borde rojo">
  <rect width="900" height="540" fill="#f7f4ef" />

  <!-- Encabezado -->
  <text x="450" y="66" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" font-weight="bold" fill="#2b2b2b">Estudio Yoga Sereno</text>
  <text x="450" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#7a6f63">Clases para todos los niveles</text>

  <!-- Videos -->
  <g font-family="system-ui, sans-serif">
    <rect x="20" y="120" width="276" height="155" rx="10" fill="#8fbf9f" />
    <text x="158" y="298" text-anchor="middle" font-size="13" fill="#5c5348">Clase de respiración</text>

    <rect x="312" y="120" width="276" height="155" rx="10" fill="#c9a877" />
    <text x="450" y="298" text-anchor="middle" font-size="13" fill="#5c5348">Posturas básicas</text>

    <rect x="604" y="120" width="276" height="155" rx="10" fill="#b6a6d6" />
    <text x="742" y="298" text-anchor="middle" font-size="13" fill="#5c5348">Meditación guiada</text>

    <!-- Planes -->
    <rect x="20" y="340" width="276" height="160" rx="10" fill="#ffffff" stroke="#e6ded2" />
    <text x="158" y="410" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Clase suelta</text>
    <text x="158" y="455" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a7d5d">$3.000</text>

    <rect x="312" y="340" width="276" height="160" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2" />
    <rect x="450" y="330" width="66" height="22" rx="4" fill="#c0392b" />
    <text x="483" y="346" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">PROMO</text>
    <text x="450" y="410" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Plan mensual</text>
    <text x="450" y="455" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a7d5d">$18.000</text>

    <rect x="604" y="340" width="276" height="160" rx="10" fill="#ffffff" stroke="#e6ded2" />
    <text x="742" y="410" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">Plan trimestral</text>
    <text x="742" y="455" text-anchor="middle" font-size="20" font-weight="bold" fill="#3a7d5d">$48.000</text>
  </g>
</svg>
