<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Referencia visual: barra fija arriba, sellos sobre los pósters y botón flotante abajo a la derecha">
  <rect width="900" height="520" fill="#f3f4f6" />
  <text x="450" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8a7a6a">Referencia — la página debería verse así (wireframe, no es pixel-perfect)</text>

  <!-- Barra fija -->
  <rect x="0" y="0" width="900" height="56" fill="#111827" />
  <text x="24" y="36" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Cine Lunar</text>
  <text x="876" y="36" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#fbbf24">Función de hoy: 21:00</text>

  <!-- Título -->
  <text x="450" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#111827">Estrenos de la semana</text>

  <!-- Película 1 con sello -->
  <rect x="44" y="150" width="260" height="220" rx="10" fill="#ffffff" stroke="#e5e7eb" />
  <rect x="60" y="166" width="228" height="140" rx="8" fill="#1e3a8a" />
  <rect x="60" y="166" width="228" height="140" rx="8" fill="url(#g1)" />
  <text x="76" y="330" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#111827">Órbita 9</text>
  <text x="76" y="352" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">Ciencia ficción — 112 min</text>
  <rect x="212" y="140" width="80" height="22" rx="11" fill="#fbbf24" />
  <text x="252" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#111827">ESTRENO</text>

  <!-- Película 2 -->
  <rect x="320" y="150" width="260" height="220" rx="10" fill="#ffffff" stroke="#e5e7eb" />
  <rect x="336" y="166" width="228" height="140" rx="8" fill="#7f1d1d" />
  <text x="352" y="330" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#111827">La casa del lago</text>
  <text x="352" y="352" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">Terror — 98 min</text>

  <!-- Película 3 -->
  <rect x="596" y="150" width="260" height="220" rx="10" fill="#ffffff" stroke="#e5e7eb" />
  <rect x="612" y="166" width="228" height="140" rx="8" fill="#065f46" />
  <text x="628" y="330" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" fill="#111827">Rutas cruzadas</text>
  <text x="628" y="352" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">Drama — 105 min</text>

  <!-- Botón flotante -->
  <rect x="706" y="450" width="170" height="46" rx="23" fill="#fbbf24" />
  <text x="791" y="478" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#111827">Comprar entradas</text>

  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
</svg>
