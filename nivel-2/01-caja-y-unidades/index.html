<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panadería La Espiga — Precios</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="panaderia">
      <header class="cabecera">
        <span class="logo">Panadería La Espiga</span>
        <p class="horario">Abierto de 7 a 20 h</p>
      </header>

      <section class="productos">
        <article class="producto">
          <span class="etiqueta">Recién horneado</span>
          <h2>Pan de campo</h2>
          <p class="precio">$2.400</p>
        </article>

        <article class="producto">
          <h2>Budín de limón</h2>
          <p class="precio">$3.800</p>
        </article>

        <article class="producto">
          <h2>Facturas x6</h2>
          <p class="precio">$3.200</p>
        </article>
      </section>

      <footer class="pie">
        <p>Av. de los Panaderos 123 — Pedidos al 4444-1111</p>
      </footer>
    </main>
  </body>
</html>
