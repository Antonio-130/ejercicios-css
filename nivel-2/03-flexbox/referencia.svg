<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Referencia visual: barra con logo y links, cuatro tarjetas en fila y pie repartido">
  <rect width="900" height="440" fill="#eef2f5" />
  <text x="450" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8a7a6a">Referencia — la página debería verse así (wireframe, no es pixel-perfect)</text>

  <!-- Barra -->
  <rect x="24" y="40" width="852" height="60" rx="8" fill="#0f3d3e" />
  <text x="48" y="76" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Gimnasio Pulso</text>
  <text x="618" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#9ad1c9">Clases</text>
  <text x="700" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#9ad1c9">Horarios</text>
  <text x="800" y="76" font-family="system-ui, sans-serif" font-size="14" fill="#9ad1c9">Contacto</text>

  <!-- Título -->
  <text x="450" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#1f2933">Nuestras clases</text>

  <!-- Tarjetas -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="24" y="164" width="200" height="176" rx="10" fill="#ffffff" stroke="#d7dee3" />
    <circle cx="124" cy="212" r="28" fill="#0f3d3e" />
    <text x="124" y="268" font-size="17" font-weight="bold" fill="#1f2933">Funcional</text>
    <text x="124" y="294" font-size="14" fill="#64748b">Lun y Mié 19 h</text>

    <rect x="240" y="164" width="200" height="176" rx="10" fill="#ffffff" stroke="#d7dee3" />
    <circle cx="340" cy="212" r="28" fill="#e07a5f" />
    <text x="340" y="268" font-size="17" font-weight="bold" fill="#1f2933">Spinning</text>
    <text x="340" y="294" font-size="14" fill="#64748b">Mar y Jue 20 h</text>

    <rect x="456" y="164" width="200" height="176" rx="10" fill="#ffffff" stroke="#d7dee3" />
    <circle cx="556" cy="212" r="28" fill="#3d7ea6" />
    <text x="556" y="268" font-size="17" font-weight="bold" fill="#1f2933">Yoga</text>
    <text x="556" y="294" font-size="14" fill="#64748b">Sáb 10 h</text>

    <rect x="672" y="164" width="200" height="176" rx="10" fill="#ffffff" stroke="#d7dee3" />
    <circle cx="772" cy="212" r="28" fill="#8e6c88" />
    <text x="772" y="268" font-size="17" font-weight="bold" fill="#1f2933">Boxeo</text>
    <text x="772" y="294" font-size="14" fill="#64748b">Vie 18 h</text>
  </g>

  <!-- Pie -->
  <rect x="24" y="368" width="852" height="48" rx="8" fill="#0f3d3e" />
  <text x="200" y="398" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5d1">Av. del Deporte 450</text>
  <text x="450" y="398" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5d1">11 5555-2020</text>
  <text x="700" y="398" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5d1">@gimnasio.pulso</text>
</svg>
