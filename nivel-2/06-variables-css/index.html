<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vivero El Roble — Catálogo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1>Vivero El Roble</h1>
      <p>Plantas de interior y de exterior</p>
    </header>

    <main class="catalogo">
      <article class="tarjeta">
        <h2>Monstera</h2>
        <p class="detalle">Interior, media sombra</p>
        <span class="precio">$8.500</span>
      </article>

      <article class="tarjeta destacada">
        <h2>Helecho</h2>
        <p class="detalle">Interior, sombra</p>
        <span class="precio">$5.200</span>
      </article>

      <article class="tarjeta">
        <h2>Olivo</h2>
        <p class="detalle">Exterior, sol pleno</p>
        <span class="precio">$12.000</span>
      </article>
    </main>

    <footer class="pie">
      <p>Av. Verde 742 — Vivero El Roble</p>
      <p>Abierto de martes a domingo</p>
    </footer>
  </body>
</html>
